schema_version: 1
config_id: h2_v1
status: frozen

revision:
  supersedes: null
  reason: initial_protocol

provenance:
  baseline_config: ../baseline/configs/baseline_reproduction.yaml
  baseline_config_sha256: 4e76db7290ea755deae7f1e0cd556a7c84b60650dcce473ad3f052709aa83417
  baseline_git_commit: 1bf5d8c7354d0b1cc5dd10034419bcff6800ba03
  require_clean_worktree: true

outputs:
  root: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1
  resolved_protocol: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/resolved_config.yaml
  input_manifest: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/input_manifest.json
  run_log: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/run.log
  aligned_metrics: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/aligned_metrics.csv
  effects: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/effects.csv
  input_audit: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/input_audit.json
  resource_report: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/resource_report.csv
  decision: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/decision.json
  summary: outputs/adaptive_seed1001_4090_v2_analysis/h2_v1/summary.json

immutability:
  config_id_reuse_after_run_start: forbidden
  frozen_parameter_change: create_new_versioned_config_id
  write_resolved_config_at_run_start: true
  config_sha256_destination: outputs.input_manifest
  write_config_sha256_into_yaml: false
  result_values_in_protocol_config: forbidden
  allowed_result_formats:
    - json
    - csv

input_integrity:
  algorithm: sha256
  audit_before_analysis: true
  record_all_actual_hashes_in: outputs.input_manifest
  failure_policy: not_assessable
  required_for:
    - matched_compute_contract
    - baseline_and_adaptive_training_metrics
    - baseline_and_adaptive_replay_outputs
    - baseline_and_adaptive_holdout_summaries
    - baseline_and_adaptive_data_quality_reports
    - protocol_configs

analysis_scope:
  analysis_only: true
  controls_training: false
  pilot_results_eligible: false
  playing_strength_results_can_change_h2: false

hypothesis:
  id: H2
  statement: At matched GPU-hours, Adaptive provides more fresh self-play states per optimizer update than Baseline, with supporting evidence from replay quality or freshness.

inputs:
  matched_compute:
    path: configs/matched_compute_v1.yaml
    sha256: 1947b3ab4918355ed1354248f679e344efd77be2f0c87a8ce3e22c85614246e6
  baseline_metrics:
    path: ../baseline/outputs/baseline_reproduction_seed1001_4090/metrics.jsonl
    sha256: 5e9a8795b7ee27706eb9db42a675c59ed72147bc8261f714245020887bb4db4f
  adaptive_metrics:
    path: outputs/adaptive_formal_seed1001_4090_v2/metrics.jsonl
    sha256: null
    sha256_required_in_input_manifest: true
  baseline_replay_summary:
    path: ../baseline/outputs/baseline_seed1001_4090_analysis/replay/replay_final_summary.json
    sha256: 530ad932329b99e52aff33fbb70fc29cca998ebac8ad70aa6ae7a8c3dc82bdc1
  adaptive_replay_summary:
    path: outputs/adaptive_seed1001_4090_v2_analysis/replay/replay_final_summary.json
    sha256: null
    sha256_required_in_input_manifest: true
  baseline_replay_iteration_metrics:
    path: ../baseline/outputs/baseline_seed1001_4090_analysis/replay/replay_iteration_stats.csv
    sha256: b97a81fbf239e9a87c4a048a250dd566041576378e07a02b7030e64df34f7e8e
  adaptive_replay_iteration_metrics:
    path: outputs/adaptive_seed1001_4090_v2_analysis/replay/replay_iteration_stats.csv
    sha256: null
    sha256_required_in_input_manifest: true
  baseline_derived_metrics:
    path: ../baseline/outputs/baseline_reproduction_seed1001_4090/gate2/derived_metrics.csv
    sha256: 9986ee28009e046bbcfb58e1b84ec3e116a7bc9c1d12858889aadac0049fe133
  adaptive_derived_metrics:
    path: outputs/adaptive_seed1001_4090_v2_analysis/derived_metrics.csv
    sha256: null
    sha256_required_in_input_manifest: true
  baseline_holdout_summary:
    path: ../baseline/outputs/baseline_seed1001_4090_analysis/holdout_v1/summary.json
    sha256: 90aee871c43b5c72778507357afa3733a3b731e0f27e33e951ed0aa12459b5dc
  adaptive_holdout_summary:
    path: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/summary.json
    sha256: null
    sha256_required_in_input_manifest: true
  adaptive_holdout_protocol:
    path: configs/adaptive_holdout_v1.yaml
    sha256: e1741f5f579822311e923b481048f6dc3ff012a6fd1bbcfdf50a5f0230e58b8e
  baseline_data_quality_report:
    path: ../baseline/outputs/baseline_reproduction_seed1001_4090/gate2/data_quality_report.json
    sha256: da2d9e6dfbad75b5941393805970e53e8a2944ba329bd303082caba8c71de300
  adaptive_data_quality_report:
    path: outputs/adaptive_seed1001_4090_v2_analysis/data_quality_report.json
    sha256: null
    sha256_required_in_input_manifest: true

alignment:
  axis: gpu_hours
  common_horizon: final_checkpoint_grid_target_capped_by_compute_budget_common_horizon
  common_horizon_source: matched_compute.pairing_and_randomness.checkpoint_grid.targets[-1].gpu_hours
  evaluation_grid_source: matched_compute.pairing_and_randomness.checkpoint_grid.targets
  checkpoint_selection: latest_completed_checkpoint_not_after_target
  checkpoint_interpolation: none
  model_interpolation: none
  iteration_selection: completed_iteration_with_cumulative_gpu_hours_not_after_target
  iteration_series_time_weighting:
    representation: right_continuous_step_over_each_completed_iteration_interval
    interval: previous_cumulative_gpu_hours_to_current_cumulative_gpu_hours
    horizon_crossing_iteration: exclude_if_completion_is_after_common_horizon
    arithmetic_metric_summary: sum(value * iteration_seconds) / sum(iteration_seconds)
    ratio_metric_summary: ratio_of_summed_numerators_and_denominators
  endpoint:
    range: previous_shared_grid_target_less_than_time_less_than_or_equal_to_final_shared_grid_target
    ratio_metrics: ratio_of_sums
    arithmetic_metrics: iteration_seconds_weighted_mean
  full_interval:
    range: greater_than_0_gpu_hours_through_common_horizon
    ratio_metrics: ratio_of_sums
    arithmetic_metrics: iteration_seconds_weighted_mean
  interpolation: none
  extrapolation: none

metric_defaults:
  effect: adaptive_value / baseline_value - 1
  non_finite_value: error
  imputation: none
  minimum_valid_points: 4
  report_endpoint_and_full_interval: true

primary_metric:
  name: fresh_states_per_update
  decision_role: primary
  source: condition_training_metrics
  formula: positions_generated / optimizer_steps
  aggregation: ratio_of_sums
  numerator: positions_generated
  denominator: optimizer_steps
  expected_effect: adaptive_greater_than_baseline
  eligible_range: iteration_1_through_common_horizon_with_optimizer_steps_greater_than_0
  missing_value_policy: exclude_missing_row_and_report
  minimum_valid_points: 4
  practical_effect_tolerance:
    type: relative
    improvement_at_or_above: 0.05
    material_deterioration_at_or_below: -0.05
  decision_summary: full_interval

complementary_metrics:
  states_per_gpu_hour:
    decision_role: efficiency_context
    source: condition_training_metrics
    formula: positions_generated / (iteration_seconds / 3600)
    aggregation: sum(positions_generated) / (sum(iteration_seconds) / 3600)
    expected_direction: increase
    eligible_range: iteration_1_through_common_horizon_with_positive_iteration_seconds
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance: 0.05_relative

  incoming_unique_state_ratio:
    decision_role: complementary_replay
    source: condition_replay_iteration_metrics
    formula: incoming_unique_states / states
    aggregation: sum(incoming_unique_states) / sum(states)
    expected_direction: increase
    eligible_range: retained_replay_iterations_after_left_censored_boundary_through_common_horizon
    missing_value_policy: exclude_incoming_ratio_left_censored_rows
    minimum_valid_points: 4
    practical_effect_tolerance: 0.05_relative

  duplicate_rate:
    decision_role: complementary_replay
    source: condition_replay_iteration_metrics
    formula: duplicate_hash_occurrences / states
    aggregation: sum(duplicate_hash_occurrences) / sum(states)
    expected_direction: decrease
    eligible_range: retained_replay_iterations_61_through_common_horizon
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance: 0.05_relative

  turnover_fraction:
    decision_role: complementary_replay
    source: condition_derived_metrics
    formula: evicted_states / previous_replay_buffer_size
    aggregation: iteration_seconds_weighted_mean
    expected_direction: increase
    eligible_range: iteration_151_through_common_horizon
    missing_value_policy: unavailable_when_fewer_than_four_jointly_eligible_points
    minimum_valid_points: 4
    practical_effect_tolerance: 0.05_relative

  mean_sample_age:
    decision_role: complementary_replay
    source: condition_derived_metrics
    formula: sum(positions_generated_i * (current_iteration - i)) / replay_buffer_size
    aggregation: iteration_seconds_weighted_mean
    expected_direction: decrease_or_not_worsen
    eligible_range: iteration_1_through_common_horizon
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance:
      improvement_at_or_below: -0.05_relative
      not_worse_upper_bound: 0.05_relative

  p90_sample_age:
    decision_role: complementary_replay
    source: condition_derived_metrics
    formula: weighted_empirical_quantile_0.90_of_sample_age
    aggregation: iteration_seconds_weighted_mean
    expected_direction: decrease_or_not_worsen
    eligible_range: iteration_1_through_common_horizon
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance:
      improvement_at_or_below: -0.05_relative
      not_worse_upper_bound: 0.05_relative

  mean_sample_exposure:
    decision_role: complementary_replay
    source: condition_training_metrics
    formula: samples_seen / replay_buffer_size
    aggregation: sum(samples_seen) / sum(replay_buffer_size)
    expected_direction: decrease_or_not_worsen
    eligible_range: iteration_1_through_common_horizon_with_nonempty_replay
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance:
      improvement_at_or_below: -0.05_relative
      not_worse_upper_bound: 0.05_relative

  selected_sample_reuse:
    decision_role: complementary_replay
    source: condition_training_metrics
    formula: samples_seen / examples_used
    aggregation: sum(samples_seen) / sum(examples_used)
    expected_direction: decrease_or_not_worsen
    eligible_range: iteration_1_through_common_horizon_with_examples_used_greater_than_0
    missing_value_policy: exclude_missing_row_and_report
    minimum_valid_points: 4
    practical_effect_tolerance:
      improvement_at_or_below: -0.05_relative
      not_worse_upper_bound: 0.05_relative

supplementary_generalisation:
  metric: approximate_online_train_holdout_total_gap
  source: baseline_and_adaptive_holdout_summaries
  expected_direction: decrease
  decision_role: supplementary_only
  can_change_h2_decision: false

required_reporting:
  self_play_fraction:
    formula: sum(self_play_seconds) / sum(iteration_seconds)
  completed_updates:
    formula: sum(optimizer_steps)
  scheduler_overhead_fraction:
    baseline_value: 0.0
    adaptive_formula: sum(scheduler_seconds) / sum(iteration_seconds)
  instrumentation_overhead_fraction:
    source: condition_instrumentation_metrics
  report_endpoint_and_full_interval: true

decision:
  statuses:
    - supported
    - partially_supported
    - not_supported
    - not_assessable
  primary_improved: primary_full_interval_relative_effect_at_least_0.05
  complementary_replay_improved: any_available_complementary_replay_metric_meets_its_improvement_tolerance
  supported: primary_improved_and_at_least_one_complementary_replay_metric_improved
  partially_supported: primary_improved_but_complementary_replay_metrics_are_mixed_unavailable_or_none_meet_improvement_tolerance
  not_supported: primary_is_assessable_and_primary_improved_is_false
  not_assessable: input_audit_failed_or_primary_metric_unavailable_or_primary_has_fewer_than_four_valid_points_or_primary_denominator_is_zero
  holdout_gap_can_change_decision: false
  playing_strength_results_can_change_decision: false
  significance_test: none

missing_values:
  non_finite_numeric_value: error
  zero_is_missing: false
  imputation: none
  interpolation: none
  insufficient_points: metric_unavailable
