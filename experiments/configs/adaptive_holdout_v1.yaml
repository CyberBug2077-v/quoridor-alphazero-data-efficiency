schema_version: 1
config_id: adaptive_holdout_v1
status: frozen

revision:
  supersedes: null
  reason: initial_protocol

provenance:
  baseline_config: ../baseline/configs/baseline_reproduction.yaml
  baseline_config_sha256: 4e76db7290ea755deae7f1e0cd556a7c84b60650dcce473ad3f052709aa83417
  baseline_git_commit: 1bf5d8c7354d0b1cc5dd10034419bcff6800ba03
  require_clean_worktree: true

outputs:
  root: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1
  resolved_protocol: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/resolved_config.yaml
  input_manifest: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/input_manifest.json
  run_log: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/evaluation.log
  checkpoint_metrics: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/checkpoint_metrics.csv
  trajectory_checkpoint_metrics: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/trajectory_checkpoint_metrics.csv
  evaluation_manifest: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/evaluation_manifest.json
  summary: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/summary.json
  evaluation_log: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v1/evaluation.log

immutability:
  config_id_reuse_after_run_start: forbidden
  frozen_parameter_change: create_new_versioned_config_id
  write_resolved_config_at_run_start: true
  config_sha256_destination: outputs.input_manifest
  write_config_sha256_into_yaml: false
  result_values_in_protocol_config: forbidden
  allowed_result_formats:
    - json
    - csv

input_integrity:
  algorithm: sha256
  required_for:
    - holdout_dataset
    - holdout_manifest
    - source_protocol
    - evaluated_checkpoints
    - protocol_configs

source_protocol:
  config: ../baseline/analysis/configs/holdout_v1.yaml
  protocol_id: fixed_holdout_v1
  expected_sha256: 039089f45b36a508d37a0c5e82542370489d0fa47b7971c809ba063935a0faa2

holdout:
  protocol_id: fixed_holdout_v1
  dataset_path: ../baseline/outputs/baseline_seed1001_4090_analysis/holdout_v1/states.npz
  manifest_path: ../baseline/outputs/baseline_seed1001_4090_analysis/holdout_v1/manifest.json
  manifest_sha256: c2e0b57a9ef4733fe59a1d8d3ee01fbb70a2241f24f92ebb33f04c152a604ef3
  expected_games: 200
  expected_states: 9259
  expected_content_sha256: 33d77cab4fd08bbad5b66c5ef7e9f359a1aacfbc078f440fe180385228879194
  expected_file_sha256: 1504cd503870f39b5e40d4ed1285bf392b22a75c375d00d23c7b669172fad863
  read_only: true
  excluded_from_replay: true
  regeneration: forbidden
  sample_selection_using_adaptive_results: forbidden

evaluated_condition:
  run_id: adaptive_formal_seed1001_4090_v2
  run_root: outputs/adaptive_formal_seed1001_4090_v2
  checkpoint_manifest: outputs/adaptive_formal_seed1001_4090_v2/checkpoint_manifest.json

checkpoint_alignment:
  contract: configs/matched_compute_v1.yaml
  contract_sha256: 1947b3ab4918355ed1354248f679e344efd77be2f0c87a8ce3e22c85614246e6
  axis: gpu_hours
  matched_gpu_hour_targets:
    - baseline_checkpoint_iteration: 0
      gpu_hours: 0.0
    - baseline_checkpoint_iteration: 20
      gpu_hours: 2.1198430262922514
    - baseline_checkpoint_iteration: 40
      gpu_hours: 4.055928015003963
    - baseline_checkpoint_iteration: 60
      gpu_hours: 5.915037855762831
    - baseline_checkpoint_iteration: 80
      gpu_hours: 7.74554526080817
    - baseline_checkpoint_iteration: 100
      gpu_hours: 9.657539357861964
    - baseline_checkpoint_iteration: 120
      gpu_hours: 11.578118647181476
    - baseline_checkpoint_iteration: 140
      gpu_hours: 13.49890914103404
    - baseline_checkpoint_iteration: 160
      gpu_hours: 15.400869534123915
    - baseline_checkpoint_iteration: 180
      gpu_hours: 17.276270976930004
    - baseline_checkpoint_iteration: 200
      gpu_hours: 19.115693432471787
    - baseline_checkpoint_iteration: 210
      gpu_hours: 20.004163361943395
  required_evaluation_points:
    - checkpoint_0
    - every_matched_target_not_after_common_horizon
    - final_common_horizon_checkpoint
  selection: latest_completed_checkpoint_not_after_target
  checkpoint_0:
    path: ../baseline/outputs/pretraining_reproduction_seed1001/checkpoints/checkpoint_0.pth.tar
    actual_gpu_hours: 0.0
    sha256: 4824a2a8ba1c1ebb5a38a992af075a45a033b87b403973b583ab98a079f35667
  final_common_horizon_checkpoint:
    target: matched_compute.pairing_and_randomness.checkpoint_grid.targets[-1].gpu_hours
    selection: latest_completed_checkpoint_not_after_common_horizon
  include_initial_checkpoint: true
  truncate_at_common_horizon: true
  missing_checkpoint: mark_target_unavailable_and_report
  checkpoint_after_target_as_fallback: forbidden
  model_parameter_interpolation: none
  metric_interpolation: none
  duplicate_selected_checkpoint: evaluate_once_and_reference_same_result

checkpoint_registry:
  source: outputs/adaptive_formal_seed1001_4090_v2/checkpoint_manifest.json
  write_selected_registry_to: outputs.evaluation_manifest
  required_fields:
    - gpu_hour_target
    - selection_role
    - checkpoint_iteration
    - checkpoint_path
    - actual_gpu_hours
    - checkpoint_sha256
    - selection_rule
  verify_sha256_before_evaluation: true

evaluation:
  model_inference_only: true
  batch_size: 1024
  bootstrap_resamples: 10000
  bootstrap_seed: 72001
  bootstrap_seed_per_checkpoint: bootstrap_seed + actual_checkpoint_iteration
  confidence_level: 0.95
  compare_to_baseline_at_same_gpu_hour_targets: true
  paired_holdout_examples: true
  loss_definition:
    policy_loss:
      grain: state
      formula: -sum(mcts_policy_target * log(softmax(valid_action_masked_logits) + 1.0e-8))
      reduction: arithmetic_mean_over_all_holdout_states
      valid_action_masking: identical_to_training
    value_loss:
      grain: state
      formula: squared_error(value_target, predicted_value)
      reduction: arithmetic_mean_over_all_holdout_states
    total_loss:
      formula: policy_loss + value_loss
  confidence_interval:
    method: nonparametric_cluster_bootstrap
    cluster: complete_holdout_game_trajectory
    draw: resample_200_games_with_replacement
    estimate_within_draw: state_weighted_mean_loss
    resamples: 10000
    confidence_level: 0.95
  train_holdout_alignment:
    training_metrics: outputs/adaptive_formal_seed1001_4090_v2/metrics.jsonl
    join_key: actual_checkpoint_iteration
    training_loss_source: same_iteration_logged_online_training_loss
    checkpoint_0_training_loss: null
    unmatched_training_iteration: fail_evaluation
    posterior_replay_recomputation: false
  approximate_gaps:
    terminology: approximate_online_train_holdout_gap
    approx_policy_gap: holdout_policy_loss - logged_train_policy_loss
    approx_value_gap: holdout_value_loss - logged_train_value_loss
    approx_total_gap: approx_policy_gap + approx_value_gap
    limitation: online_train_loss_is_replay_sampled_and_not_a_posterior_loss_over_the_complete_iteration_replay
  required_checkpoint_metric_fields:
    - gpu_hour_target
    - checkpoint_iteration
    - actual_gpu_hours
    - checkpoint_sha256
    - holdout_policy_loss
    - holdout_policy_loss_ci_low
    - holdout_policy_loss_ci_high
    - holdout_value_loss
    - holdout_value_loss_ci_low
    - holdout_value_loss_ci_high
    - holdout_total_loss
    - logged_train_policy_loss
    - logged_train_value_loss
    - approx_policy_gap
    - approx_value_gap
    - approx_total_gap
    - evaluation_seconds

missing_values:
  non_finite_metric: fail_evaluation
  missing_checkpoint: mark_target_unavailable
  imputation: none
  interpolation: none
