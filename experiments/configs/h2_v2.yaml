    sha256: fa1c8c42d488c1786b9922f638165d73763dba59089fedfdf94eb0e72cc53538
  adaptive_holdout_summary:
    path: outputs/adaptive_seed1001_4090_v2_analysis/holdout_v2/summary.json
    sha256: 72bd18cc975a4f189b795589a2142977f0a27827fdf038939ac3027484bdda95

alignment:
  axis: gpu_hours
  common_horizon_source: matched_compute.pairing_and_randomness.checkpoint_grid.targets[-1].gpu_hours
  common_horizon_cap: matched_compute.compute_budget.common_horizon.maximum_gpu_hours
  common_horizon: min(final_checkpoint_grid_target, common_horizon_cap)
  endpoint_start: greatest_checkpoint_grid_target_strictly_below_common_horizon
  grid_selection: latest_completed_iteration_with_cumulative_gpu_hours_lte_target
  full_interval: 0 < cumulative_gpu_hours <= common_horizon
  endpoint_interval: endpoint_start < cumulative_gpu_hours <= common_horizon
  checkpoint_interpolation: none
  metric_interpolation: none
  extrapolation: none

metric_defaults:
  raw_relative_effect: adaptive_value / baseline_value - 1
  minimum_valid_points_per_condition: 4
  decision_scope: full_interval
  non_finite_value: input_audit_failure
  imputation: none

metrics:
  fresh_states_per_update:
    source: metrics
    aggregation: ratio_of_sums
    numerator: positions_generated
    denominator: optimizer_steps
    expected_direction: increase
    practical_threshold: 0.05
    decision_role: primary

  states_per_gpu_hour:
    source: metrics
    aggregation: ratio_of_sums
    numerator: positions_generated
    denominator: iteration_gpu_hours
    expected_direction: increase
    practical_threshold: 0.05
    decision_role: efficiency_context

  incoming_unique_state_ratio:
    source: replay
    aggregation: ratio_of_sums
    numerator: incoming_unique_states
    denominator: states
    expected_direction: increase
    practical_threshold: 0.05
    decision_role: complementary_replay
    exclude_when_true: incoming_ratio_left_censored

  duplicate_rate:
    source: replay
    aggregation: ratio_of_sums
    numerator: duplicate_hash_occurrences
    denominator: states
    expected_direction: decrease
    practical_threshold: 0.05
    decision_role: complementary_replay

  turnover_fraction:
    source: derived
    aggregation: iteration_seconds_weighted_mean
    value: turnover_fraction
    weight: iteration_seconds
    expected_direction: increase
    practical_threshold: 0.05
    decision_role: complementary_replay
    require_positive: evicted_states

  mean_sample_age:
    source: derived
    aggregation: iteration_seconds_weighted_mean
    value: mean_sample_age
    weight: iteration_seconds
    expected_direction: decrease
    practical_threshold: 0.05
    decision_role: complementary_replay

  p90_sample_age:
    source: derived
    aggregation: iteration_seconds_weighted_mean
    value: p90_sample_age
    weight: iteration_seconds
    expected_direction: decrease
    practical_threshold: 0.05
    decision_role: complementary_replay

  mean_sample_exposure:
    source: metrics
    aggregation: ratio_of_sums
    numerator: samples_seen
    denominator: replay_buffer_size
    expected_direction: decrease
    practical_threshold: 0.05
    decision_role: complementary_replay

  selected_sample_reuse:
    source: metrics
    aggregation: ratio_of_sums
    numerator: samples_seen
    denominator: examples_used
    expected_direction: decrease
    practical_threshold: 0.05
    decision_role: complementary_replay

supplementary_holdout:
  metric: approximate_online_train_holdout_total_gap
  source: holdout_summary
  expected_direction: decrease
  decision_role: supplementary_only
  can_change_h2_decision: false
  unavailable_policy: record_unavailable_without_changing_h2

resources:
  completed_updates: sum(optimizer_steps)
  self_play_fraction: sum(self_play_seconds) / sum(iteration_seconds)
  scheduler_overhead_fraction:
    baseline: 0.0
    adaptive: sum(scheduler_seconds) / sum(iteration_seconds)
  instrumentation_overhead_fraction:
    baseline: unavailable
    adaptive: sum(instrumentation_seconds) / sum(iteration_seconds)

decision:
  statuses:
    - supported
    - partially_supported
    - not_supported
    - not_assessable
  primary_metric: fresh_states_per_update
  primary_threshold: 0.05
  complementary_role: complementary_replay
  complementary_requirement: at_least_one_full_interval_metric_improved
  supported: primary_improved_and_at_least_one_complementary_replay_metric_improved
  partially_supported: primary_improved_but_no_complementary_replay_metric_improved
  not_supported: primary_assessable_but_improvement_below_threshold
  not_assessable: input_audit_failed_or_primary_unavailable_or_fewer_than_four_points_or_zero_denominator
  holdout_gap_can_change_decision: false
  significance_test: none
