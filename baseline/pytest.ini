[pytest]
addopts = --strict-markers
testpaths = tests analysis/tests
python_files = test_*.py
markers =
    gpu: requires a CUDA-capable GPU and may allocate device memory
    slow: takes materially longer than the ordinary unit and artifact tests
    integration: crosses process, filesystem, dataset, model, or GPU boundaries
    e2e: runs the complete smoke training, resume, evaluation, and verification pipeline
