run:
  id: baseline_pilot_seed1001_4090
  seed: 1001
  device: cuda
  gpu_index: 0
  deterministic: false
  output_dir: outputs/baseline_pilot_seed1001_4090

# This is weight initialization for a new online run, never a resume. No
# pretraining examples, replay, optimizer, or tracker state may be restored.
initialization:
  mode: pretrained_checkpoint
  checkpoint_path: outputs/pretraining_reproduction_seed1001/checkpoints/checkpoint_0.pth.tar
  expected_sha256: 4824a2a8ba1c1ebb5a38a992af075a45a033b87b403973b583ab98a079f35667
  load_weights: true
  load_replay: false
  load_optimizer_state: false
  load_tracker_state: false
  start_iteration: 1

model:
  board_size: 9
  num_channels: 128
  num_res_blocks: 6
  attn_depth: 1
  num_heads: 8
  se_enabled: false
  dropout: 0.3

budget:
  # Launch fresh with CLI stop-after=5, then resume the same run to this target.
  max_iterations: 7

self_play:
  iterations: 7
  games_per_iteration: 75
  mcts_simulations: 200
  eval_mcts_in_batch: 10
  temperature_threshold: 15
  cpuct: 1.25
  dirichlet_noise: true
  dirichlet_alpha: 0.15
  dirichlet_epsilon: 0.25
  max_game_length: 150

training:
  epochs: 4
  batch_size: 2048
  micro_batch_size: 2048
  learning_rate: 0.0002
  optimizer: adamw
  weight_decay: 0.0001
  gradient_clip: 1.0
  amp: true
  amp_dtype: bf16
  update_gating: false

replay:
  max_queue_size: 500000
  max_train_samples: 200000
  history_iterations: 150

checkpoint:
  directory: outputs/baseline_pilot_seed1001_4090/checkpoints
  save_every_iterations: 1
  save_replay_state: true
  save_instrumentation_state: true
  save_rng_state: true
  compute_sha256: true

instrumentation:
  enabled: true
  tracker_file: tracker.json
  track_iteration_timing: true
  track_resource_usage: true
  persist_tracker_state: true
  verify_resume_continuity: true
  verify_evaluation_read_only: true
  measure_overhead: true

logging:
  metrics_file: metrics.jsonl
  metadata_file: run_metadata.json
  evaluation_file: evaluation.json
  summary_file: summary.json

evaluation:
  enabled: true
  evaluate_every_iterations: 1
  games_per_opponent: 2
  opponents:
    - random
    - greedy
  model_mcts_simulations: 200
  eval_mcts_in_batch: 4
  temperature: 0
  dirichlet_noise: false
  max_game_length: 150
  alternate_starting_player: true
