run:
  id: baseline_reproduction_seed1001
  seed: 1001
  device: cuda
  gpu_index: 0
  deterministic: false
  output_dir: outputs/baseline_reproduction_seed1001

# Baseline and Adaptive must point to this exact pretrained snapshot. This is
# initialization of a fresh online replay, not restoration of an online run.
initialization:
  mode: pretrained_checkpoint
  checkpoint_path: outputs/pretraining_reproduction_seed1001/checkpoints/checkpoint_0.pth.tar
  expected_sha256: 4824a2a8ba1c1ebb5a38a992af075a45a033b87b403973b583ab98a079f35667
  load_weights: true
  load_replay: false
  load_optimizer_state: false
  load_tracker_state: false
  start_iteration: 1

model:
  board_size: 9
  num_channels: 128
  num_res_blocks: 6
  attn_depth: 1
  num_heads: 8
  se_enabled: false
  dropout: 0.3

# Fill these three fields only after the 1-2 hour benchmark. max_iterations is
# a safety ceiling, not a request to alter any algorithmic setting.
budget:
  max_gpu_hours: null
  max_wall_clock_hours: null
  max_iterations: null

self_play:
  iterations: null
  games_per_iteration: 75
  mcts_simulations: 200
  eval_mcts_in_batch: 4
  temperature_threshold: 15
  cpuct: 1.25
  dirichlet_noise: true
  dirichlet_alpha: 0.15
  dirichlet_epsilon: 0.25
  max_game_length: 150

training:
  epochs: 4
  batch_size: 2048
  micro_batch_size: 2048
  learning_rate: 0.0002
  optimizer: adamw
  weight_decay: 0.0001
  gradient_clip: 1.0
  amp: true
  amp_dtype: bf16
  update_gating: false

# Pure self-play only: there is deliberately no expert-data/top-up field.
replay:
  max_queue_size: 500000
  max_train_samples: 200000
  history_iterations: 150

checkpoint:
  directory: outputs/baseline_reproduction_seed1001/checkpoints
  save_every_iterations: null
  save_replay_state: true
  save_instrumentation_state: true
  save_rng_state: true
  compute_sha256: true

instrumentation:
  enabled: true
  tracker_file: tracker.json
  track_iteration_timing: true
  track_resource_usage: true
  persist_tracker_state: true
  verify_resume_continuity: true
  verify_evaluation_read_only: true
  measure_overhead: true

logging:
  metrics_file: metrics.jsonl
  metadata_file: run_metadata.json
  evaluation_file: evaluation.json
  summary_file: summary.json

evaluation:
  enabled: true
  evaluate_every_iterations: null
  games_per_opponent: null
  opponents:
    - random
    - greedy
  model_mcts_simulations: 200
  eval_mcts_in_batch: 4
  temperature: 0
  dirichlet_noise: false
  max_game_length: 150
  alternate_starting_player: true
