schema_version: 1

analysis:
  id: baseline_gate2
  input_run_id: baseline_reproduction_seed1001_4090
  seed: 31001

inputs:
  run_directory: outputs/baseline_reproduction_seed1001_4090
  source_config: configs/baseline_reproduction.yaml
  resolved_config: outputs/baseline_reproduction_seed1001_4090/resolved_config.yaml
  run_metadata: outputs/baseline_reproduction_seed1001_4090/run_metadata.json
  training_metrics: outputs/baseline_reproduction_seed1001_4090/metrics.jsonl
  run_summary: outputs/baseline_reproduction_seed1001_4090/summary.json
  replay_snapshot: outputs/baseline_reproduction_seed1001_4090/checkpoints/latest.examples
  checkpoint_0: outputs/pretraining_reproduction_seed1001/checkpoints/checkpoint_0.pth.tar
  trained_checkpoint_pattern: outputs/baseline_reproduction_seed1001_4090/checkpoints/checkpoint_{iteration}.pth.tar
  existing_evaluations: outputs/baseline_reproduction_seed1001_4090/evaluations

checkpoints:
  iterations:
    - 0
    - 20
    - 40
    - 60
    - 80
    - 100
    - 120
    - 140
    - 160
    - 180
    - 200
    - 210

replay:
  history_iterations: 150
  snapshot_iteration: 210
  generation_iteration_field: replay_batch_index
  # The downloaded snapshot retains generations 61--210. Metrics that require
  # an earlier generation are null at the left-censored boundary.
  retained_iteration_start: 61
  retained_iteration_end: 210
  left_censored_boundary_policy: null

state_hash:
  algorithm: sha256
  definition: "SHA256(dtype + shape + contiguous canonical-board bytes)"
  board_representation: canonical_player_to_move
  symmetry_reduction: none
  dtype_encoding: numpy_dtype_str_utf8
  shape_encoding: comma_separated_base10_dimensions_utf8
  byte_order: C
  contiguous_conversion: numpy_ascontiguousarray

replay_metrics:
  notation:
    batch_state_set: "S_t = set of state hashes in generation iteration t"
    replay_occurrences: "W_t = all sample occurrences retained by the 150-iteration replay at t"
    generation_iteration: "g(x) = generation iteration of sample occurrence x"
  turnover:
    unit: adjacent_generation_iterations
    formula: "turnover_t = 1 - |S_t intersect S_(t-1)| / |S_t union S_(t-1)|"
    undefined_when: "t-1 is not present in the retained replay snapshot"
  age:
    unit: iterations
    formula: "mean_age_t = (1 / |W_t|) * sum_{x in W_t} (t - g(x))"
    weighting: sample_occurrence
    current_iteration_age: 0
  reuse:
    unit: replay_sample_occurrences
    formula: "reuse_t = 1 - |{hash(x) : x in W_t}| / |W_t|"
    duplicate_policy: every occurrence after the first occurrence of a hash counts as reuse
    undefined_when: "W_t is empty"

baseline_metrics:
  fresh_states_per_update: "positions_generated / optimizer_steps"
  states_per_gpu_hour: "positions_generated / (iteration_seconds / 3600)"
  games_per_gpu_hour: "games_completed / (iteration_seconds / 3600)"
  self_play_fraction: "self_play_seconds / iteration_seconds"
  training_fraction: "training_seconds / iteration_seconds"
  buffer_inflow_fraction: "positions_generated / replay_buffer_size"
  buffer_fraction_consumed: "examples_used / replay_buffer_size"
  mean_sample_exposure: "samples_seen / replay_buffer_size"
  selected_sample_reuse: "samples_seen / examples_used"
  evicted_states: "positions_generated_(t-150) if t > 150 else 0"
  turnover_fraction: "evicted_states / previous_replay_buffer_size; 0 when evicted_states is 0"
  sample_age:
    current_iteration_age: 0
    weighting: positions_generated
    retained_window_iterations: 150
    mean: "sum(positions_generated_i * (t-i)) / replay_buffer_size for retained i"
    median: weighted_empirical_quantile_0.50
    p90: weighted_empirical_quantile_0.90
    quantile_method: smallest_age_with_cumulative_weight_at_least_q_times_buffer_size

holdout:
  protocol_config: analysis/configs/holdout_v1.yaml
  source: checkpoint_0_alphazero_mcts_self_play_generated_once_after_training
  source_checkpoint_iteration: 0
  policy_target: mcts_root_visit_distribution
  sample_format: canonical_board_policy_value_valids_step_game_length
  excluded_from_training: true
  seed: 71001
  games: 200
  game_seed_formula: "seed + zero_based_game_index"
  max_game_length: 150
  canonical_view: current_player_to_move
  duplicate_non_acting_player_view: false
  shared_between_baseline_and_adaptive: true
  frozen_dataset_states: 9259
  frozen_dataset_file_sha256: 1504cd503870f39b5e40d4ed1285bf392b22a75c375d00d23c7b669172fad863
  frozen_dataset_content_sha256: 33d77cab4fd08bbad5b66c5ef7e9f359a1aacfbc078f440fe180385228879194

plateau:
  metric: fixed_basket_macro_score
  method: rolling_ols_slope_with_paired_stratified_bootstrap
  window_checkpoints: 4
  bootstrap_seed: 81001
  bootstrap_resamples: 10000
  confidence_level: 0.95
  slope_unit_iterations: 20
  maximum_absolute_score_change_over_window: 0.03
  # A window is flat only if zero is in the paired-bootstrap confidence
  # interval for its OLS slope and its endpoint score change is at most 0.03.
  require_slope_confidence_interval_contains_zero: true
  consecutive_qualifying_windows: 2
  plateau_iteration: first_checkpoint_of_first_qualifying_window
  insufficient_evidence_result: null

outputs:
  root: outputs/baseline_reproduction_seed1001_4090/gate2
  derived_metrics: outputs/baseline_reproduction_seed1001_4090/gate2/derived_metrics.csv
  baseline_resource_summary: outputs/baseline_reproduction_seed1001_4090/gate2/baseline_resource_summary.json
  data_quality_report: outputs/baseline_reproduction_seed1001_4090/gate2/data_quality_report.json
  resolved_protocol: outputs/baseline_reproduction_seed1001_4090/gate2/resolved_baseline_gate2.yaml
  input_manifest: outputs/baseline_reproduction_seed1001_4090/gate2/input_manifest.json
  run_log: outputs/baseline_reproduction_seed1001_4090/gate2/gate2.log
  replay_iteration_metrics: outputs/baseline_seed1001_4090_analysis/replay/replay_iteration_stats.csv
  replay_summary: outputs/baseline_seed1001_4090_analysis/replay/replay_final_summary.json
  trajectory_stats: outputs/baseline_seed1001_4090_analysis/replay/trajectory_stats.csv
  state_hash_manifest: outputs/baseline_reproduction_seed1001_4090/gate2/replay/state_hash_manifest.json
  fixed_basket_root: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1
  fixed_basket_protocol: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/protocol.resolved.yaml
  fixed_basket_manifest: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/evaluation_manifest.json
  fixed_basket_games: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/games.jsonl
  fixed_basket_checkpoint_summary: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/checkpoint_summary.csv
  fixed_basket_opponent_summary: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/opponent_summary.csv
  fixed_basket_elo_summary: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/elo_summary.csv
  fixed_basket_evaluation_log: outputs/baseline_seed1001_4090_analysis/fixed_basket_v1/evaluation.log
  holdout_root: outputs/baseline_seed1001_4090_analysis/holdout_v1
  holdout_protocol: outputs/baseline_seed1001_4090_analysis/holdout_v1/protocol.resolved.yaml
  holdout_manifest: outputs/baseline_seed1001_4090_analysis/holdout_v1/manifest.json
  holdout_games: outputs/baseline_seed1001_4090_analysis/holdout_v1/games.jsonl
  holdout_shards: outputs/baseline_seed1001_4090_analysis/holdout_v1/shards
  holdout_states: outputs/baseline_seed1001_4090_analysis/holdout_v1/states.npz
  holdout_generation_log: outputs/baseline_seed1001_4090_analysis/holdout_v1/generation.log
  holdout_checkpoint_metrics: outputs/baseline_seed1001_4090_analysis/holdout_v1/checkpoint_metrics.csv
  holdout_trajectory_checkpoint_metrics: outputs/baseline_seed1001_4090_analysis/holdout_v1/trajectory_checkpoint_metrics.csv
  holdout_summary: outputs/baseline_seed1001_4090_analysis/holdout_v1/summary.json
  plateau_windows: outputs/baseline_seed1001_4090_analysis/h1_v1/plateau_windows.csv
  plateau_result: outputs/baseline_seed1001_4090_analysis/h1_v1/plateau.json
  plot_learning_curve_png: outputs/baseline_reproduction_seed1001_4090/gate2/plots/learning_curve.png
  plot_replay_dynamics_png: outputs/baseline_reproduction_seed1001_4090/gate2/plots/replay_dynamics.png
  summary: outputs/baseline_reproduction_seed1001_4090/gate2/summary.json
